
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="blog-post-card">
      <img
        class="post-img"
        src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        alt="Scenic landscape featured in the blog post"
      >

      <div class="post-content">
        <h2 class="post-title">
          My Journey to Becoming a Full Stack Developer
        </h2>

        <p class="post-excerpt">
          Every great developer starts somewhere. Join me as I
          explore HTML, CSS, JavaScript, React, and backend
          development while building real-world projects
          and improving my programming skills.
        </p>

        <a class="read-more" href="#">
          Read More
        </a>
      </div>
    </div>
  </body>
</html>
